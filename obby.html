<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Obby Rush</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{padding:0;color-scheme:dark}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
  html,body{margin:0;height:100%;background:#7ec8ff;overflow:hidden;font-family:'Fredoka',system-ui,sans-serif;color:#fff}
  canvas#c{position:absolute;inset:0;width:100%;height:100%;display:block}
  .abs{position:absolute}
  #hud{position:absolute;left:0;right:0;top:max(8px,env(safe-area-inset-top));text-align:center;pointer-events:none;text-shadow:0 2px 0 rgba(0,0,0,.45)}
  #timer{font-size:clamp(22px,5vw,34px);font-weight:700;letter-spacing:1px;font-variant-numeric:tabular-nums}
  #place{font-size:clamp(12px,3vw,16px);font-weight:700;opacity:.95}
  #stage{font-size:clamp(11px,2.6vw,14px);opacity:.9}
  #coins{position:absolute;right:max(62px,calc(env(safe-area-inset-right) + 54px));top:max(16px,calc(env(safe-area-inset-top) + 8px));font-weight:700;font-size:16px;text-shadow:0 2px 0 rgba(0,0,0,.45);pointer-events:none}
  #toast{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-size:clamp(16px,4vw,26px);font-weight:700;text-shadow:0 3px 0 rgba(0,0,0,.5);opacity:0;transition:opacity .25s;pointer-events:none;text-align:center;white-space:nowrap}
  #big{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(60px,18vw,140px);font-weight:700;text-shadow:0 6px 0 rgba(0,0,0,.4);pointer-events:none}
  .rb{position:absolute;right:max(10px,env(safe-area-inset-right));width:44px;height:44px;border-radius:12px;border:3px solid rgba(255,255,255,.85);background:rgba(20,30,60,.55);font-size:20px;display:flex;align-items:center;justify-content:center;color:#fff;touch-action:manipulation}
  .rb:active{transform:scale(.93)}
  #jump{position:absolute;right:max(22px,env(safe-area-inset-right));bottom:max(26px,env(safe-area-inset-bottom));width:88px;height:88px;border-radius:50%;border:4px solid #fff;background:rgba(255,200,40,.75);font-family:inherit;font-size:16px;font-weight:700;color:#3a2a00;touch-action:manipulation}
  #jump:active{background:rgba(255,230,90,.95);transform:scale(.95)}
  .stick{position:absolute;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;border:3px solid rgba(255,255,255,.55);background:rgba(255,255,255,.14);display:none;pointer-events:none}
  .stick b{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,255,255,.65)}
  #chatwrap{position:absolute;left:max(8px,env(safe-area-inset-left));top:max(8px,env(safe-area-inset-top));width:min(48vw,330px);display:flex;flex-direction:column;gap:5px}
  #chat{max-height:32vh;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(0,0,0,.35);border-radius:8px;padding:5px 7px;font-size:clamp(11px,2.7vw,13px);line-height:1.35;pointer-events:none;text-shadow:0 1px 0 #000;word-break:break-word}
  #chat div{opacity:.95}
  #cin{display:none;gap:4px;flex-wrap:wrap}
  #cin .q{font-family:inherit;font-size:12px;padding:5px 8px;border-radius:12px;border:2px solid #fff;background:rgba(20,30,60,.7);color:#fff;touch-action:manipulation}
  #cin form{display:flex;gap:4px;width:100%}
  #cin input{flex:1;min-width:0;font-family:inherit;font-size:14px;padding:6px 8px;border-radius:8px;border:2px solid #fff;background:rgba(20,30,60,.85);color:#fff;user-select:text;-webkit-user-select:text;touch-action:auto}
  .ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;text-align:center;background:rgba(30,60,120,.55);backdrop-filter:blur(3px);overflow:auto}
  #menu{display:flex}
  .logo{font-size:clamp(38px,11vw,78px);font-weight:700;line-height:1;text-shadow:0 5px 0 #1b3a8a,0 9px 0 rgba(0,0,0,.25);color:#ffe14d;transform:rotate(-3deg)}
  .sub{font-size:clamp(12px,3vw,16px);opacity:.95;max-width:480px}
  .modes{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .btn{font-family:inherit;font-weight:700;font-size:clamp(14px,3.6vw,19px);padding:12px 20px;border-radius:14px;border:4px solid #fff;color:#fff;cursor:pointer;touch-action:manipulation;text-shadow:0 2px 0 rgba(0,0,0,.35);min-width:140px}
  .btn small{display:block;font-weight:500;font-size:11px;opacity:.9}
  .btn:active{transform:translateY(2px)}
  .b1{background:#e8453c}.b2{background:#2f8cff}.b3{background:#2bb46a}.b4{background:#ff9d1a}
  .sw{display:flex;gap:8px;justify-content:center}
  .sw i{width:34px;height:34px;border-radius:8px;border:3px solid #fff;display:block;cursor:pointer;touch-action:manipulation}
  .sw i.on{outline:4px solid #ffe14d}
  #res h2{margin:0;font-size:clamp(28px,8vw,48px);color:#ffe14d;text-shadow:0 4px 0 #1b3a8a}
  #resb{font-size:clamp(13px,3.2vw,17px);line-height:1.6;background:rgba(0,0,0,.3);border-radius:12px;padding:10px 16px;min-width:230px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><div id="timer">0:00.00</div><div id="place"></div><div id="stage"></div></div>
<div id="coins">🪙 0</div>
<div id="toast"></div>
<div id="big"></div>
<div id="chatwrap"><div id="chat"></div>
  <div id="cin"><div id="qk" style="display:flex;gap:4px;flex-wrap:wrap"></div><form id="cf"><input id="ct" maxlength="60" placeholder="Say something..." autocomplete="off"><button class="q" style="font-family:inherit;border:2px solid #fff;background:#2bb46a;color:#fff;border-radius:8px;padding:0 10px">Send</button></form></div></div>
<button class="rb" id="bMenu" style="top:max(8px,env(safe-area-inset-top))">⏸</button>
<button class="rb" id="bChat" style="top:max(58px,calc(env(safe-area-inset-top) + 50px));display:none">💬</button>
<div id="sL" class="stick"><b></b></div>
<button class="rb" id="bDance" style="bottom:max(130px,calc(env(safe-area-inset-bottom) + 122px))">💃</button>
<button class="rb" id="bReset" style="bottom:max(184px,calc(env(safe-area-inset-bottom) + 176px))">↺</button>
<button id="jump">JUMP</button>

<div class="ov" id="menu">
  <div class="logo">OBBY<br>RUSH</div>
  <div class="sub">Race the bots, beat the lava, and watch them argue about it. Left thumb moves, drag the right side to look, tap JUMP.</div>
  <div class="sw" id="sw"></div>
  <div class="modes">
    <button class="btn b1" data-m="race">Bot Race<small>5 bots, big chat drama</small></button>
    <button class="btn b2" data-m="speed">Speedrun<small>splits + ghost of your best</small></button>
    <button class="btn b3" data-m="chill">Chill Mode<small>no timer, just vibes</small></button>
  </div>
  <div class="sub" id="best"></div>
</div>
<div class="ov" id="res"><h2 id="resT">YOU WIN!</h2><div id="resb"></div>
  <div class="modes"><button class="btn b4" id="again">Run it back</button><button class="btn b2" id="toMenu">Menu</button></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.random()*a.length|0];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ================= audio ================= */
let AC=null,master=null;
function audioInit(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.4;master.connect(AC.destination)}catch(e){AC=null}}
function tone(f,d,type='square',vol=.2,slide=0,delay=0){
  if(!AC)return;const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d);
}
const sfx={
  jump(){tone(320,.14,'square',.12,260)},
  coin(){tone(988,.08,'square',.14);tone(1319,.18,'square',.14,0,.07)},
  oof(){tone(260,.35,'sawtooth',.25,-190)},
  cp(){[523,659,784].forEach((f,i)=>tone(f,.18,'triangle',.22,0,i*.09))},
  pad(){tone(200,.3,'sine',.3,600)},
  vanish(){tone(180,.2,'triangle',.1,-80)},
  win(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,.3,'triangle',.25,0,i*.12))},
  beep(){tone(660,.15,'square',.2)},
  go(){tone(1100,.4,'square',.25)},
  msg(){tone(900,.04,'sine',.05)}
};

/* ================= three setup ================= */
const renderer=new THREE.WebGLRenderer({canvas:$('c'),antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x8fd3ff);scene.fog=new THREE.Fog(0x8fd3ff,140,520);
const cam=new THREE.PerspectiveCamera(70,1,.5,1400);
scene.add(new THREE.HemisphereLight(0xffffff,0x7a9ac8,.9));
const sun=new THREE.DirectionalLight(0xffffff,.65);sun.position.set(60,120,40);scene.add(sun);
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
const sea=new THREE.Mesh(new THREE.PlaneGeometry(4000,4000),new THREE.MeshLambertMaterial({color:0x2f86e0}));
sea.rotation.x=-Math.PI/2;sea.position.y=-45;scene.add(sea);
const clouds=[];
for(let i=0;i<26;i++){
  const g=new THREE.Group();
  for(let j=0;j<4;j++){const m=new THREE.Mesh(new THREE.BoxGeometry(rnd(14,26),rnd(5,8),rnd(10,16)),new THREE.MeshBasicMaterial({color:0xffffff}));m.position.set(j*10-15,rnd(-1,2),rnd(-3,3));g.add(m)}
  g.position.set(rnd(-300,300),rnd(60,170),rnd(-100,900));scene.add(g);clouds.push(g);
}

/* ================= avatars ================= */
const SKINS=['#ffd04d','#f4b183','#c68a5a'];
function makeAvatar(shirt,pants,skin){
  const g=new THREE.Group(),mats=[];
  const M=c=>{const m=new THREE.MeshLambertMaterial({color:c});mats.push(m);return m};
  const mk=(w,h,d,c,x,y,z,par)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c));m.position.set(x,y,z);(par||g).add(m);return m};
  mk(2,2,1,shirt,0,3,0);
  const head=mk(1.7,1.5,1.6,skin||'#ffd04d',0,4.75,0);
  // face
  const fc=document.createElement('canvas');fc.width=fc.height=64;const f=fc.getContext('2d');
  f.fillStyle='#222';f.fillRect(16,18,8,12);f.fillRect(40,18,8,12);
  f.strokeStyle='#222';f.lineWidth=5;f.lineCap='round';f.beginPath();f.arc(32,36,13,.15*Math.PI,.85*Math.PI);f.stroke();
  const ft=new THREE.CanvasTexture(fc);
  const face=new THREE.Mesh(new THREE.PlaneGeometry(1.5,1.35),new THREE.MeshBasicMaterial({map:ft,transparent:true}));
  face.position.set(0,0,.81);head.add(face);
  const mkLimb=(x,y,w,h,c)=>{const p=new THREE.Group();p.position.set(x,y,0);const m=mk(w,h,w,c,0,-h/2,0,p);g.add(p);return p};
  const aL=mkLimb(-1.5,4,1,2,shirt),aR=mkLimb(1.5,4,1,2,shirt);
  const lL=mkLimb(-.5,2,1,2,pants),lR=mkLimb(.5,2,1,2,pants);
  const a2=mkLimb; // hands
  g.userData={aL,aR,lL,lR,head,mats,face};
  return g;
}
function animAvatar(g,speed,t,air,dance){
  const u=g.userData;
  if(dance){const s=Math.sin(t*12);u.aL.rotation.z=2.4+s*.4;u.aR.rotation.z=-2.4-s*.4;u.lL.rotation.x=s*.5;u.lR.rotation.x=-s*.5;u.aL.rotation.x=u.aR.rotation.x=0;return}
  if(air){u.aL.rotation.z=2.2;u.aR.rotation.z=-2.2;u.aL.rotation.x=u.aR.rotation.x=0;u.lL.rotation.x=.4;u.lR.rotation.x=-.4;return}
  u.aL.rotation.z=u.aR.rotation.z=0;
  const s=Math.sin(t*10)*Math.min(1,speed/10)*.9;
  u.lL.rotation.x=s;u.lR.rotation.x=-s;u.aL.rotation.x=-s;u.aR.rotation.x=s;
}
function setOpacity(g,o){g.userData.mats.forEach(m=>{m.transparent=o<1;m.opacity=o});g.userData.face.material.opacity=o}
function textSprite(text,color,w=256,h=64,fs=34){
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
  x.font='700 '+fs+'px Fredoka,system-ui,sans-serif';x.textAlign='center';x.textBaseline='middle';
  x.lineWidth=7;x.strokeStyle='rgba(0,0,0,.7)';x.strokeText(text,w/2,h/2);x.fillStyle=color;x.fillText(text,w/2,h/2);
  const t=new THREE.CanvasTexture(c);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true}));
  s.scale.set(w/36,h/36,1);return s;
}
function makeBubble(){
  const c=document.createElement('canvas');c.width=512;c.height=170;
  const t=new THREE.CanvasTexture(c);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthTest:false}));
  s.scale.set(13,4.3,1);s.visible=false;s.renderOrder=10;s.userData={c,t};return s;
}
function drawBubble(s,text){
  const {c,t}=s.userData,x=c.getContext('2d');x.clearRect(0,0,512,170);
  x.fillStyle='rgba(255,255,255,.95)';x.beginPath();x.roundRect?x.roundRect(6,6,500,130,26):x.rect(6,6,500,130);x.fill();
  x.beginPath();x.moveTo(236,134);x.lineTo(256,164);x.lineTo(276,134);x.fill();
  x.fillStyle='#1a1a2a';x.font='700 30px Fredoka,system-ui,sans-serif';x.textAlign='center';x.textBaseline='middle';
  const words=text.split(' ');const lines=[];let cur='';
  for(const w of words){const test=cur?cur+' '+w:w;if(x.measureText(test).width>470&&cur){lines.push(cur);cur=w}else cur=test}
  lines.push(cur);const ls=lines.slice(0,3),lh=34,y0=71-(ls.length-1)*lh/2;
  ls.forEach((l,i)=>x.fillText(l,256,y0+i*lh));
  t.needsUpdate=true;s.visible=true;
}
const blobGeo=new THREE.CircleGeometry(1.2,16),blobMat=new THREE.MeshBasicMaterial({color:0,transparent:true,opacity:.28,depthWrite:false});
function makeBlob(){const m=new THREE.Mesh(blobGeo,blobMat);m.rotation.x=-Math.PI/2;scene.add(m);return m}

/* ================= course ================= */
const solids=[],route=[],cps=[],coinsArr=[];
const edgeMat=new THREE.LineBasicMaterial({color:0x000000,transparent:true,opacity:.35});
const COL=['#ff5d5d','#ffa94d','#ffe14d','#5dde7b','#4dc3ff','#8a7dff','#ff7de0'];
const lmat=(c,e)=>new THREE.MeshLambertMaterial({color:c,emissive:e||0x000000});
function box(x,y,z,w,h,d,color,o={}){
  const geo=new THREE.BoxGeometry(w,h,d),m=new THREE.Mesh(geo,lmat(color,o.emissive));
  m.position.set(x,y,z);scene.add(m);
  if(!o.noEdge)m.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo),edgeMat));
  const s=Object.assign({m,x,y,z,w,h,d,kind:'solid',ox:x,oy:y,oz:z,dx:0,dy:0,dz:0,on:true},o);
  solids.push(s);return s;
}
const topY=s=>s.y+s.h/2;
function R(s,o={}){route.push({s,ox:o.ox||0,oz:o.oz||0,hard:!!o.hard,pad:!!o.pad,cp:o.cp})}
const STAGES=['Easy Hops','Lava Lake','Moving Mania','Spinner Beams','Vanishing Tiles','Sky Climb','Narrow Beams','Rainbow Finale'];
let finishSolid=null;
(function build(){
  let zc=0,cy=0,cx=0;
  function checkpoint(idx,x,z,y,w=18,d=18){
    const s=box(x,y-.5,z,w,1,d,'#f2f2fa',{cp:idx});
    box(x-w/2+1.5,y+4,z-d/2+1.5,.5,8,.5,'#ddd',{kind:'deco',noEdge:true});
    const flag=new THREE.Mesh(new THREE.BoxGeometry(4,2.4,.3),new THREE.MeshLambertMaterial({color:idx?0x2bb46a:0xe8453c}));
    flag.position.set(x-w/2+3.7,y+7,z-d/2+1.5);scene.add(flag);
    cps.push({x,z,y,idx,s});R(s,{cp:idx});return s;
  }
  function nextCP(idx,gap=5,w=18,d=18){const z=zc+gap+d/2;const s=checkpoint(idx,cx,z,cy,w,d);zc=z+d/2;return s}
  // spawn
  checkpoint(0,0,0,0,26,26);zc=13;
  // 1 easy hops
  {let z=zc+5;for(let i=0;i<8;i++){const x=cx+Math.sin(i*1.4)*7;const s=box(x,cy-.5,z+3.5,7,1,7,COL[i%7]);R(s);z+=12}zc=z-5;nextCP(1)}
  // 2 lava lake
  {const n=8,start=zc+5,len=n*11+12;
   box(0,cy-4,start+len/2,70,1,len,'#ff5a1f',{kind:'lava',emissive:0xff3300,noEdge:true});
   for(let i=0;i<n;i++){const x=(i%2?-1:1)*(i%3)*2.4;const s=box(x,cy-.5,start+4+i*11,5,1,5,COL[(i+2)%7]);R(s,{hard:true})}
   zc=start+4+(n-1)*11+2.5;nextCP(2)}
  // 3 moving mania
  {let z=zc+6;for(let i=0;i<6;i++){
     const vertical=i%2===1;
     const s=box(0,cy-.5,z+4,8,1,8,COL[(i+4)%7],{kind:'mover',axis:vertical?'y':'x',amp:vertical?4:11,sp:vertical?1.3:.8+.08*i,ph:i*1.7});
     if(vertical)s.oy=cy+3.5-.5+.5;
     R(s,{hard:true});z+=14}
   zc=z-6;nextCP(3,5)}
  // 4 spinner beams
  {let z=zc+6;const sp=[1.5,-1.9,2.2];
   for(let i=0;i<3;i++){
     const s=box(0,cy-.5,z+11,22,1,22,['#6c7a89','#7f8fa6','#5f6b78'][i]);
     const bar=new THREE.Mesh(new THREE.BoxGeometry(20,1.6,1.6),lmat('#e8453c'));bar.position.set(0,topY(s)+1.2,z+11);scene.add(bar);
     const hub=new THREE.Mesh(new THREE.CylinderGeometry(1.4,1.4,2.4,12),lmat('#333'));hub.position.set(0,topY(s)+1.2,z+11);scene.add(hub);
     solids.push({kind:'spinner',m:bar,x:0,y:topY(s)+1.2,z:z+11,len:20,sp:sp[i],ang:i,on:true});
     R(s,{ox:-9,oz:-9,hard:true});R(s,{ox:9,oz:9,hard:true});
     z+=28}
   zc=z-6;nextCP(4,2)}
  // 5 vanishing tiles
  {let z=zc+5;for(let r=0;r<7;r++){for(let c=-1;c<=1;c++){
       const s=box(c*8,cy-.5,z+3,6,1,6,COL[(r+c+3)%7],{kind:'vanish',st:0,tm:0});if(c===0)R(s,{hard:r%2===0})}
     z+=8}
   zc=z-2;nextCP(5,3)}
  // 6 sky climb
  {let z=zc+6;for(let i=0;i<8;i++){cy+=4.5;const x=(i%2?-1:1)*5;const s=box(x,cy-.5,z+3,6,1,6,COL[(i+1)%7]);R(s,{hard:i>3});z+=11}
   const pad=box(0,cy-.5+.5,z+4,6,.8,6,'#2bd45a',{kind:'pad',emissive:0x0a5a20});R(pad,{pad:true});
   cy+=17;const tg=box(0,cy-.5,z+4+15,14,1,14,'#f2f2fa');
   zc=z+4+15+7;cps.push({x:0,z:zc-7,y:cy,idx:6,s:tg});tg.cp=6;R(tg,{cp:6});}
  // 7 narrow beams
  {const plat=(x,z)=>{const s=box(x,cy-.5,z,9,1,9,'#ffd04d');R(s,{});return s};
   let z=zc+3;
   const bz=(x,z0,dir)=>{const s=box(x,cy-.5,z0+dir*13,3,1,26,'#8a7dff');[-8,0,8].forEach(o=>R(s,{oz:dir*o,hard:true}));return z0+dir*26};
   const bx=(x0,z0,dir)=>{const s=box(x0+dir*13,cy-.5,z0,26,1,3,'#4dc3ff');[-8,0,8].forEach(o=>R(s,{ox:dir*o,hard:true}));return x0+dir*26};
   let x=0;
   let e=bz(0,z,1);                    z=e+3+4.5;plat(0,z);
   let xe=bx(0+4.5+3-3,z,1);           x=xe+3+4.5;plat(x,z);

const RAD=1,H=5.2;
const isCol=s=>s.kind==='solid'||s.kind==='mover'||s.kind==='vanish'||s.kind==='pad'||s.kind==='finish';
const colSolids=solids.filter(isCol),spinners=solids.filter(s=>s.kind==='spinner'),lavas=solids.filter(s=>s.kind==='lava'),movers=solids.filter(s=>s.kind==='mover'),vanishers=solids.filter(s=>s.kind==='vanish');
function ov(s,px,py,pz){return s.on&&Math.abs(px-s.x)<RAD+s.w/2&&Math.abs(pz-s.z)<RAD+s.d/2&&py<s.y+s.h/2&&py+H>s.y-s.h/2}
function anyOv(px,py,pz){for(const s of colSolids)if(ov(s,px,py,pz))return true;return false}
function updateWorld(dt){
  for(const s of movers){const p=moverPos(s,time);s.dx=p.x-s.x;s.dy=p.y-s.y;s.dz=p.z-s.z;s.x=p.x;s.y=p.y;s.z=p.z;s.m.position.set(s.x,s.y,s.z)}
  for(const s of vanishers){
    if(s.st===1){s.tm-=dt;s.m.position.y=s.y+Math.sin(time*60)*.12;if(s.tm<=0){s.st=2;s.tm=2.6;s.on=false;s.m.visible=false;sfx.vanish()}}
    else if(s.st===2){s.tm-=dt;if(s.tm<=0){s.st=0;s.on=true;s.m.visible=true;s.m.position.y=s.y}}
  }
  for(const s of spinners){s.ang+=s.sp*dt;s.m.rotation.y=s.ang}
  for(const c of clouds){c.position.x+=dt*2;if(c.position.x>320)c.position.x=-320}
  for(const c of coinsArr){if(c.got){c.m.visible=false;continue}const s=c.s;c.m.visible=true;c.m.position.set(s.x+c.ox,topY(s)+3+Math.sin(time*3+c.ox)*.4,s.z+c.oz);c.m.rotation.z=time*3}
}
function killTest(px,py,pz){
  for(const s of lavas)if(ov(s,px,py,pz))return 'lava';
  for(const s of spinners){
    const dx=px-s.x,dz=pz-s.z,c=Math.cos(-s.ang),sn=Math.sin(-s.ang);
    const lx=dx*c-dz*sn,lz=dx*sn+dz*c;
    if(Math.abs(lx)<s.len/2+.4&&Math.abs(lz)<1.5&&py<s.y+.9&&py+H>s.y-.9)return 'spin';
  }
  return null;
}
function physics(dt){
  // carry
  if(P.ground&&P.ground.kind==='mover'){P.x+=P.ground.dx;P.y+=P.ground.dy;P.z+=P.ground.dz}
  const steps=Math.ceil(dt/.008),h=dt/steps;
  P.coyote-=dt;P.jbuf-=dt;
  for(let k=0;k<steps;k++){
    P.vy=Math.max(-130,P.vy-150*h);
    // x
    P.x+=P.vx*h;
    for(const s of colSolids)if(ov(s,P.x,P.y,P.z)){
      const t=topY(s);
      if(t-P.y<=.8&&t-P.y>0&&!anyOv2(s,P.x,t+.01,P.z)){P.y=t}
      else P.x=P.vx>0?s.x-s.w/2-RAD:s.x+s.w/2+RAD;
    }
    P.z+=P.vz*h;
    for(const s of colSolids)if(ov(s,P.x,P.y,P.z)){
      const t=topY(s);
      if(t-P.y<=.8&&t-P.y>0&&!anyOv2(s,P.x,t+.01,P.z)){P.y=t}
      else P.z=P.vz>0?s.z-s.d/2-RAD:s.z+s.d/2+RAD;
    }
    // y
    P.y+=P.vy*h;let landed=null;
    for(const s of colSolids)if(ov(s,P.x,P.y,P.z)){
      if(P.vy<=0){P.y=topY(s);landed=s}else{P.y=s.y-s.h/2-H;P.vy=0}
    }
    if(landed){
      if(landed.kind==='pad'){P.vy=88;landed=null;sfx.pad();P.coyote=0}
      else P.vy=0;
    }
    P.ground=landed;
    if(landed)P.coyote=.1;
  }
  P.onGround=!!P.ground;
  if(P.jbuf>0&&P.coyote>0){P.vy=52;P.coyote=0;P.jbuf=0;P.ground=null;P.onGround=false;sfx.jump()}
  if(P.ground){
    const s=P.ground;
    if(s.kind==='vanish'&&s.st===0){s.st=1;s.tm=.55}
    if(s.cp!==undefined&&s.cp>P.cpI)reachCP(s.cp);
    if(s.kind==='finish'&&G.st==='run')finishRun();
  }
}
function anyOv2(skip,px,py,pz){for(const s of colSolids)if(s!==skip&&ov(s,px,py,pz))return true;return false}

function botUpdate(b,dt){
  const s=b.st;let moving=false;
  if(G.st==='cd'||G.st==='menu'||G.st==='res'&&false){return}
  if(s==='idle'){
    const rs=route[b.idx].s;
    if(rs.kind==='mover'){b.pos.x+=rs.dx;b.pos.y+=rs.dy;b.pos.z+=rs.dz}
    b.w-=dt;
    if(b.w<=0){
      const nx=b.idx+1;
      if(nx>=route.length){
        if(!b.done){b.done=true;b.doneT=G.t||0;chatEvent('bot_win',{b})}
        b.st='party';b.w=5+rnd(0,4);return;
      }
      const tgt0=botTargetPos(nx,time);
      const dist=b.pos.distanceTo(tgt0);
      const r=route[nx];
      b.dur=clamp(dist/(13*b.sp),.38,r.pad?1.3:1.05);
      b.to=botTargetPos(nx,time+b.dur);b.from=b.pos.clone();b.u=0;b.next=nx;
      b.arc=r.pad?9:2+dist*.28;
      const hardP=r.hard?(1-b.skill)*.36:(1-b.skill)*.05;
      b.fail=Math.random()<hardP||(r.s.kind==='vanish'&&!r.s.on);
      if(b.fail){
        const dir=b.to.clone().sub(b.from).setY(0).normalize();
        b.to=b.to.clone().add(dir.multiplyScalar(-dist*.35)).add(new THREE.Vector3(rnd(-3,3),0,rnd(-1,1)));b.to.y=b.from.y;b.failKind=rnd(0,1)<.5;
      }
      b.st='hop';
    }
  }else if(s==='hop'){
    b.u+=dt/b.dur;const u=Math.min(1,b.u);
    b.pos.lerpVectors(b.from,b.to,u);b.pos.y+=4*b.arc*u*(1-u);moving=true;
    const dx=b.to.x-b.from.x,dz=b.to.z-b.from.z;if(dx*dx+dz*dz>.01)b.face=Math.atan2(dx,dz);
    if(b.u>=1){
      if(b.fail){b.st='fall';b.vy=0;const d=b.to.clone().sub(b.from).setY(0).normalize();b.vx=d.x*9;b.vz=d.z*9}
      else{
        b.idx=b.next;b.pos.copy(botTargetPos(b.idx,time));b.pos.x+=rnd(-1,1)*.3;
        const r=route[b.idx];
        if(r.s.kind==='pad')sfx.pad();
        if(r.cp!==undefined&&r.cp>0&&r.cp>(b.cpNum||0)){b.cpNum=r.cp;b.cpIdx=b.idx;chatEvent('bot_cp',{b,s:STAGES[r.cp]||'the finale'})}
        b.w=rnd(.04,.28)*(1.5-b.skill)*1.4;b.st='idle';
      }
    }
  }else if(s==='fall'){
    b.vy-=150*dt;b.pos.y+=b.vy*dt;b.pos.x+=b.vx*dt;b.pos.z+=b.vz*dt;moving=true;
    if(b.pos.y<topY(route[b.idx].s)-30){b.st='dead';b.w=1.1;b.falls++;chatEvent('bot_fell',{b,n:b.falls})}
  }else if(s==='dead'){
    b.w-=dt;b.av.visible=false;
    if(b.w<=0){b.av.visible=true;b.idx=b.cpIdx;b.pos.copy(botTargetPos(b.idx,time));b.st='idle';b.w=.6}
  }else if(s==='party'){
    b.w-=dt;b.dance=true;
    if(b.w<=0){b.dance=false;botStart(b,bots.indexOf(b));b.cpNum=0;b.done=false}
  }
  if(s!=='party')b.dance=false;
  b.av.position.copy(b.pos);
  let d=b.face-b.av.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));b.av.rotation.y+=d*Math.min(1,dt*12);
  animAvatar(b.av,moving&&s==='hop'?10:0,time+b.sp,s==='hop'||s==='fall',b.dance);
  if(b.bt>0){b.bt-=dt;if(b.bt<=0)b.bub.visible=false}
  blobUpdate(b.blob,b.pos.x,b.pos.y,b.pos.z,b.av.visible);
}
function blobUpdate(blob,x,y,z,vis){

function newTopic(){
  let i;do{i=Math.random()*TOPICS.length|0}while(i===chat.lastTopic);
  chat.topic=chat.lastTopic=i;chat.since=0;chat.stance=new Map();
  bots.forEach(b=>chat.stance.set(b,Math.random()<.5?0:1));

function speakNext(){
  if(!bots.length)return;
  const ev=chat.queue.shift();
  if(ev){say(ev.b,ev.text);chat.last={b:ev.b,kind:'event'};return}
  if(chat.topic==null||chat.since>(chat.limit||0)){
    newTopic();chat.limit=Math.floor(rnd(12,26));
    const b=pick(bots);
    say(b,unique(()=>PL.react()+' '+claim(b)+(Math.random()<.4?' '+PL.taunt():'')+' '+PL.emoji()));
    chat.last={b,kind:'kick'};chat.since++;return;
  }
  chat.since++;
  const last=chat.last;let cand=bots.filter(x=>!last||x!==last.b);
  let b=cand.length?pick(cand):bots[0];
  if(last&&last.target&&cand.includes(last.target)&&Math.random()<.9)b=last.target;
  let text,kind,target=null;
  if(last&&last.kind==='accuse'&&last.target===b){
    kind='defend';target=last.b;
    text=unique(()=>PL.defend()+(Math.random()<.5?', '+PL.defTail():'')+' '+PL.emoji()+' @'+target.n);
  }else if(last&&last.kind==='defend'&&Math.random()<.6){
    kind='double';target=last.b;
    text=unique(()=>'@'+target.n+' '+PL.dbl()+' '+PL.taunt()+' '+PL.emoji());
  }else if(Math.random()<.2){
    kind='accuse';target=pick(others(b));
    text=unique(()=>fill(PL.accuse(),{t:target.n})+' '+PL.emoji());
  }else if(Math.random()<.08){
    kind='lag';text=unique(()=>PL.lag()+' '+PL.emoji());
  }else{
    const tg=(last&&last.b!==b&&last.b)||pick(others(b));target=tg;
    const same=chat.stance.get(b)===chat.stance.get(tg);
    kind=same?'agree':'disagree';
    text=unique(()=>(Math.random()<.7?'@'+tg.n+' ':'')+(same?PL.agr():PL.dis())+' '+claim(b)+(Math.random()<.35?', '+PL.evid():'')+(Math.random()<.5?' '+PL.taunt():'')+' '+PL.emoji());
  }
  say(b,text);chat.last={b,kind,target};
}

let lastT=performance.now(),placeT=0;
function frame(now){
  const dt=Math.min(.05,(now-lastT)/1000);lastT=now;time+=dt;
  updateWorld(dt);
  const st=G.st;
  if(st==='cd'){
    G.cd-=dt;const n=Math.ceil(G.cd);
    if(G.cd>0){const s=n>3?'':String(n);if($('big').textContent!==s){$('big').textContent=s;if(s)sfx.beep()}}
    else{G.st='run';$('big').textContent='GO!';sfx.go();setTimeout(()=>{if($('big').textContent==='GO!')$('big').textContent=''},700)}
  }
  if(st==='run'||st==='cd'||st==='fin'||st==='res'||st==='free'){
    playerUpdate(dt,st);
    bots.forEach(b=>botUpdate(b,dt));
  }
  if(G.st==='run'&&MODES[mode].timer||G.st==='run'){
    G.t+=dt;if(MODES[mode].timer)$('timer').textContent=fmt(G.t);
    G.recT+=dt;if(G.recT>=.1&&MODES[mode].timer){G.recT=0;G.rec.push([+P.x.toFixed(1),+P.y.toFixed(1),+P.z.toFixed(1),+P.face.toFixed(2)])}
  }
  // ghost
  if(ghost&&G.st==='run'){
    const f=G.t*10,i=Math.floor(f),a=ghostData[Math.min(i,ghostData.length-1)],b=ghostData[Math.min(i+1,ghostData.length-1)],u=f-i;
    ghost.position.set(a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u,a[2]+(b[2]-a[2])*u);ghost.rotation.y=a[3];
    animAvatar(ghost,8,time,false,false);
  }
  // particles
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;p.vy-=40*dt;p.m.position.x+=p.vx*dt;p.m.position.y+=p.vy*dt;p.m.position.z+=p.vz*dt;p.m.rotation.x+=dt*5;if(p.life<=0){scene.remove(p.m);parts.splice(i,1)}}
  // place
  placeT-=dt;
  if(placeT<=0&&(G.st==='run'||G.st==='fin')&&mode==='race'&&bots.length){placeT=.25;updatePlace()}
  else if(mode!=='race'||!bots.length)$('place').textContent=G.st==='run'&&bots.length?'':'';
  chatTick(dt);
  // camera
  const tx=P.x,ty=P.y+4.2,tz=P.z;
  const cp=Math.cos(camS.pitch);
  const want=new THREE.Vector3(tx+Math.sin(camS.yaw)*cp*camS.dist,ty+Math.sin(camS.pitch)*camS.dist,tz+Math.cos(camS.yaw)*cp*camS.dist);
  cam.position.lerp(want,Math.min(1,dt*10));cam.lookAt(tx,ty,tz);
  renderer.render(scene,cam);
  requestAnimationFrame(frame);
}
function playerUpdate(dt,st){
  if(P.deadT>0){
    P.deadT-=dt;P.av.visible=Math.floor(time*16)%2===0;
    if(P.deadT<=0){P.av.visible=true;respawn()}
    blobUpdate(P.blob,P.x,P.y,P.z,false);return;
  }
  let mx=0,my=0;
  if(stk){const m=Math.hypot(stk.dx,stk.dy);if(m>.12){mx=stk.dx;my=stk.dy}}
  if(keys.KeyA||keys.ArrowLeft)mx-=1;if(keys.KeyD||keys.ArrowRight)mx+=1;
  if(keys.KeyW||keys.ArrowUp)my-=1;if(keys.KeyS||keys.ArrowDown)my+=1;
  if(keys.KeyQ)camS.yaw-=dt*2;if(keys.KeyE)camS.yaw+=dt*2;
  let m=Math.hypot(mx,my);if(m>1){mx/=m;my/=m;m=1}
  const locked=st==='cd'||st==='fin'||st==='res';
  if(locked){mx=my=0;if(st!=='cd')P.dance=Math.max(P.dance,0)}
  const y=camS.yaw,fx=-Math.sin(y),fz=-Math.cos(y),rx=Math.cos(y),rz=-Math.sin(y);
  const wx=fx*-my+rx*mx,wz=fz*-my+rz*mx,spd=16;
  const k=Math.min(1,dt*(P.onGround?18:6));
  P.vx+=(wx*spd-P.vx)*k;P.vz+=(wz*spd-P.vz)*k;
  if(m>0){P.dance=0;const tf=Math.atan2(wx,wz);let d=tf-P.face;d=Math.atan2(Math.sin(d),Math.cos(d));P.face+=d*Math.min(1,dt*14)}
  if(inp.jump&&!locked&&P.jbuf<=0&&P.onGround){P.jbuf=.14}
  physics(dt);
  P.dance=Math.max(0,P.dance-dt);
  P.speed=Math.hypot(P.vx,P.vz);
  P.av.position.set(P.x,P.y,P.z);P.av.rotation.y=P.dance>0?time*8:P.face;
  animAvatar(P.av,P.speed,time,!P.onGround,P.dance>0);
  blobUpdate(P.blob,P.x,P.y,P.z,true);
  // hazards
  if(!locked){
    const kt=killTest(P.x,P.y,P.z);if(kt)die(kt);
    else if(P.y<cps[P.cpI].y-32)die('void');
    // coins
    for(const c of coinsArr)if(!c.got){const dx=c.m.position.x-P.x,dy=c.m.position.y-(P.y+2.5),dz=c.m.position.z-P.z;if(dx*dx+dy*dy+dz*dz<12){c.got=true;G.coins++;sfx.coin();$('coins').textContent='🪙 '+G.coins}}
  }
}

  const me=G.st==='fin'||G.st==='res'?1e6-G.t:cum[pIdx];
  const arr=[{n:'You',p:me}];
  bots.forEach(b=>arr.push({n:b.n,p:b.done?1e6-b.doneT:cum[b.idx]+(b.st==='hop'?(cum[b.next]-cum[b.idx])*b.u:0)}));
  arr.sort((a,b)=>b.p-a.p);
  const rank=arr.findIndex(a=>a.n==='You')+1;
  $('place').textContent='Place '+ord(rank)+' / '+arr.length+'   •   Leader: '+arr[0].n;
  if(rank===1&&G.t>8&&time-chat.lastLead>40){chat.lastLead=time;chatEvent('lead',{});chat.queue.push({b:pick(bots),text:fill(PL.pLead(),{p:'You'})})}
}
showMenu();
requestAnimationFrame(frame);
window.__dbg={P,bots,G:()=>G,route,solids,startMode,cps,chat};
</script>
